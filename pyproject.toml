[project]
name = "ai-agent-toolbox"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "DarioCheca", email = "checa.dario@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "anthropic>=2.7.0",
    "pydantic>=2.14.3",
]

[project.scripts]
ai-agent-toolbox = "ai_agent_toolbox:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.4",
]
